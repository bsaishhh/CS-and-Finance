<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Fundamentals & Finance MCQ Portal</title>
    <meta name="description" content="Interactive MCQ Viewer and Quiz Portal for Computer Science Fundamentals, DSA, and Core Finance.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- MathJax for LaTeX / Math equations -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            /* Dark Theme Colors (Default) */
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --bg-card: rgba(17, 24, 39, 0.75);
            --bg-card-hover: rgba(31, 41, 55, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --accent-subtle: rgba(99, 102, 241, 0.12);
            
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.3);
            
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.3);
            
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.12);
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.25);
            
            --sidebar-width: 320px;
            --header-height: 70px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-hover: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --accent-subtle: rgba(99, 102, 241, 0.08);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism Background Gradients */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -10%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(60px);
        }
        .glow-2 {
            position: absolute;
            bottom: 10%;
            right: 10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
        }

        /* App Layout */
        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 40;
            transition: var(--transition);
            backdrop-filter: blur(12px);
        }

        .sidebar-header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .brand-text span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-search {
            padding: 16px 20px 8px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.95rem;
        }

        .search-input {
            width: 100%;
            height: 42px;
            padding: 0 16px 0 38px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--bg-secondary);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .category-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 6px 12px;
            margin-bottom: 2px;
        }

        .subject-nav-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: var(--transition);
        }

        .subject-nav-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transform: translateX(2px);
        }

        .subject-nav-btn.active {
            background: var(--accent-subtle);
            border-color: var(--border-hover);
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .subject-btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .subject-icon {
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .subject-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-count {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .subject-nav-btn.active .badge-count {
            background: var(--accent-primary);
            color: white;
            border-color: transparent;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .custom-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .custom-upload-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            background: var(--accent-subtle);
        }

        /* Main Content Area */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
        }

        /* Top Navbar */
        .navbar {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            backdrop-filter: blur(12px);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
        }

        .current-subject-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            height: 38px;
            padding: 0 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .action-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-sm);
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        /* Content Container */
        .content-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px 80px;
            flex: 1;
        }

        /* Hero Banner */
        .subject-hero {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .subject-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
        }

        .hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 12px;
        }

        .hero-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hero-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: var(--shadow-sm);
        }

        .hero-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .hero-description {
            color: var(--text-secondary);
            font-size: 0.96rem;
            max-width: 680px;
        }

        .hero-stats {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
        }

        .stat-pill strong {
            color: var(--text-primary);
        }

        /* Filter & Navigation Bar */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .module-select {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            cursor: pointer;
            max-width: 380px;
        }

        .module-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .quiz-score-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--success);
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            padding: 6px 14px;
            border-radius: var(--radius-full);
        }

        /* Question Cards */
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
        }

        .question-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
        }

        .card-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-number-badge {
            background: var(--accent-gradient);
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            letter-spacing: 0.02em;
        }

        .module-tag {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .bookmark-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px;
        }

        .bookmark-btn:hover, .bookmark-btn.bookmarked {
            color: var(--warning);
            transform: scale(1.15);
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .question-text img, .explanation-content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            margin: 12px 0;
            border: 1px solid var(--border-color);
            background: white;
            padding: 6px;
        }

        /* Options Grid */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .option-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateX(3px);
        }

        .option-key {
            width: 26px;
            height: 26px;
            border-radius: var(--radius-full);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            margin-top: 1px;
            transition: var(--transition);
        }

        .option-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Quiz Mode Selected Options */
        .option-item.correct {
            background: var(--success-bg) !important;
            border-color: var(--success) !important;
        }
        .option-item.correct .option-key {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .option-item.incorrect {
            background: var(--error-bg) !important;
            border-color: var(--error) !important;
        }
        .option-item.incorrect .option-key {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }

        .option-item.revealed-correct {
            border-color: var(--success) !important;
            background: var(--success-bg) !important;
        }

        /* Explanation Box */
        .explanation-wrapper {
            margin-top: 16px;
            border-top: 1px dashed var(--border-color);
            padding-top: 14px;
        }

        .explanation-toggle-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-family: var(--font-sans);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }

        .explanation-toggle-btn:hover {
            color: var(--accent-primary-hover);
            text-decoration: underline;
        }

        .explanation-content {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 14px 18px;
            margin-top: 10px;
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .correct-answer-header {
            font-weight: 700;
            color: var(--success);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Pagination */
        .pagination-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
        }

        .page-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
        }

        .page-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: transparent;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Mobile Styles */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: var(--shadow-lg);
            }
            .main-wrapper {
                margin-left: 0;
                width: 100%;
            }
            .menu-toggle-btn {
                display: block;
            }
            .navbar {
                padding: 0 16px;
            }
            .content-container {
                padding: 20px 16px 60px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="brand">
                    <div class="brand-logo">🎓</div>
                    <div class="brand-text">MCQ <span>Portal</span></div>
                </a>
            </div>

            <div class="sidebar-search">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="global-search-input" class="search-input" placeholder="Search questions & topics..." autocomplete="off">
                </div>
            </div>

            <div class="sidebar-content" id="sidebar-subjects">
                <!-- Dynamically populated from subjects.json -->
            </div>

            <div class="sidebar-footer">
                <label for="custom-file-input" class="custom-upload-btn">
                    <span>📁</span> Upload Custom JSON
                </label>
                <input type="file" id="custom-file-input" accept=".json" multiple style="display: none;">
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Navbar -->
            <header class="navbar">
                <div class="nav-left">
                    <button class="menu-toggle-btn" id="menu-toggle" aria-label="Toggle Sidebar">☰</button>
                    <div class="current-subject-badge" id="current-subject-badge">
                        <span id="nav-subject-icon">💻</span>
                        <span id="nav-subject-title">Computer Fundamentals</span>
                    </div>
                </div>

                <div class="nav-actions">
                    <button class="action-btn" id="mode-toggle-btn" title="Toggle Practice Quiz Mode vs Study Mode">
                        <span id="mode-icon">🎯</span>
                        <span id="mode-text">Quiz Mode</span>
                    </button>

                    <button class="action-btn" id="toggle-all-answers-btn" title="Show or hide all answers">
                        <span>👁️</span>
                        <span id="answers-toggle-text">Show All</span>
                    </button>

                    <button class="icon-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Theme toggle">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-container">
                <!-- Subject Hero -->
                <div class="subject-hero" id="subject-hero">
                    <div class="hero-top">
                        <div class="hero-title-group">
                            <div class="hero-icon" id="hero-icon">💻</div>
                            <div>
                                <h1 class="hero-title" id="hero-title">Computer Fundamentals</h1>
                                <p class="hero-description" id="hero-description">Hardware, CPU, I/O, Storage, Number Systems, and Computer Codes.</p>
                            </div>
                        </div>
                    </div>

                    <div class="hero-stats">
                        <div class="stat-pill">
                            <span>📚 Modules:</span>
                            <strong id="stat-modules">19</strong>
                        </div>
                        <div class="stat-pill">
                            <span>❓ Total Questions:</span>
                            <strong id="stat-questions">980</strong>
                        </div>
                        <div class="stat-pill" id="score-pill" style="display: none;">
                            <span>🏆 Score:</span>
                            <strong id="stat-score">0 / 0</strong>
                        </div>
                    </div>
                </div>

                <!-- Filter Controls -->
                <div class="filter-bar">
                    <select id="module-filter-select" class="module-select" aria-label="Filter by Module">
                        <option value="ALL">All Modules / Chapters</option>
                    </select>

                    <div id="quiz-score-container" class="quiz-score-badge" style="display: none;">
                        <span>🎯 Quiz Progress:</span>
                        <span id="quiz-score-display">0 / 0 (0%)</span>
                    </div>
                </div>

                <!-- Questions Container -->
                <div class="questions-list" id="questions-list">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading questions...</p>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination-bar" id="pagination-bar"></div>
            </main>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // State Management
        const state = {
            subjects: [],
            currentSubject: null,
            currentQuestions: [],
            filteredQuestions: [],
            activeModule: "ALL",
            searchQuery: "",
            currentPage: 1,
            pageSize: 25,
            isQuizMode: false,
            showAllAnswers: false,
            quizScores: {}, // { questionId: { selected: 'a', isCorrect: true } }
            bookmarks: JSON.parse(localStorage.getItem('mcq_bookmarks') || '[]'),
            theme: localStorage.getItem('mcq_theme') || 'dark'
        };

        // Fallback default subjects in case subjects.json is loaded locally via file://
        const defaultSubjects = [
            { file: "1000 Computer Fundamental MCQs.json", title: "Computer Fundamentals", icon: "💻", category: "Core CS", description: "Hardware, CPU, I/O, Storage, Number Systems, and Computer Codes.", total_questions: 980 },
            { file: "1000 Operating System MCQs.json", title: "Operating Systems", icon: "⚙️", category: "Systems", description: "Processes, Threads, CPU Scheduling, Deadlocks, Memory Management, and File Systems.", total_questions: 1121 },
            { file: "1000 DBMS MCQs.json", title: "DBMS & SQL", icon: "🗄️", category: "Databases", description: "Relational Models, SQL Queries, Normalization, Indexing, Transactions, and Concurrency.", total_questions: 910 },
            { file: "1000 Computer Network MCQs.json", title: "Computer Networks", icon: "🌐", category: "Networks", description: "OSI & TCP/IP Layers, Routing Protocols, Transport, DNS, HTTP, and Security.", total_questions: 1219 },
            { file: "1000 Data Structure MCQs (DSA I).json", title: "Data Structures (DSA I)", icon: "🌲", category: "DSA", description: "Arrays, Stacks, Queues, Linked Lists, Trees, Heaps, and Hash Tables.", total_questions: 1293 },
            { file: "1000 Algorithm MCQs (DSA II).json", title: "Algorithms (DSA II)", icon: "⚡", category: "DSA", description: "Searching, Sorting, Dynamic Programming, Greedy, Graph Algorithms, and Number Theory.", total_questions: 2123 },
            { file: "1000 Computer Architecture MCQs.json", title: "Computer Architecture", icon: "🖥️", category: "Hardware", description: "Instruction Sets, Pipelining, Cache Memory, I/O Organization, and Processor Design.", total_questions: 750 },
            { file: "1000 Object Oriented Programming MCQs.json", title: "Object-Oriented Programming", icon: "🧩", category: "Software", description: "Classes, Objects, Inheritance, Polymorphism, Encapsulation, and Design Patterns.", total_questions: 1350 },
            { file: "1000 Software Engineering MCQs.json", title: "Software Engineering", icon: "🛠️", category: "Software", description: "SDLC Models, Requirements Engineering, Software Design, Testing, and Quality Metrics.", total_questions: 1028 },
            { file: "1000 Core Finance MCQs.json", title: "Core Finance", icon: "📈", category: "Finance", description: "Corporate Finance, Financial Statements, Valuation, Fixed Income, Derivatives, and Portfolio Management.", total_questions: 196 }
        ];

        // Initialize Theme
        document.documentElement.setAttribute('data-theme', state.theme);
        updateThemeIcon();

        // DOM Elements
        const sidebarSubjects = document.getElementById('sidebar-subjects');
        const questionsList = document.getElementById('questions-list');
        const paginationBar = document.getElementById('pagination-bar');
        const moduleFilterSelect = document.getElementById('module-filter-select');
        const globalSearchInput = document.getElementById('global-search-input');
        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const modeIcon = document.getElementById('mode-icon');
        const modeText = document.getElementById('mode-text');
        const toggleAllAnswersBtn = document.getElementById('toggle-all-answers-btn');
        const answersToggleText = document.getElementById('answers-toggle-text');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIcon = document.getElementById('theme-icon');
        const menuToggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');

        // Event Listeners
        themeToggleBtn.addEventListener('click', toggleTheme);
        modeToggleBtn.addEventListener('click', toggleQuizMode);
        toggleAllAnswersBtn.addEventListener('click', toggleAllAnswers);
        globalSearchInput.addEventListener('input', handleSearch);
        moduleFilterSelect.addEventListener('change', handleModuleFilter);
        menuToggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        // Custom File Upload
        document.getElementById('custom-file-input').addEventListener('change', handleCustomFileUpload);

        // App Init
        async function initApp() {
            try {
                const response = await fetch('./subjects.json');
                if (response.ok) {
                    state.subjects = await response.json();
                } else {
                    state.subjects = defaultSubjects;
                }
            } catch (e) {
                console.warn("Using fallback subject list", e);
                state.subjects = defaultSubjects;
            }

            renderSidebar();
            if (state.subjects.length > 0) {
                loadSubject(state.subjects[0]);
            }
        }

        // Render Sidebar
        function renderSidebar() {
            sidebarSubjects.innerHTML = '';
            
            // Group by category
            const categories = {};
            state.subjects.forEach(sub => {
                const cat = sub.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(sub);
            });

            for (const [catName, subList] of Object.entries(categories)) {
                const group = document.createElement('div');
                group.className = 'category-group';
                
                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = catName;
                group.appendChild(title);

                subList.forEach(sub => {
                    const btn = document.createElement('button');
                    btn.className = `subject-nav-btn ${state.currentSubject && state.currentSubject.file === sub.file ? 'active' : ''}`;
                    btn.onclick = () => {
                        loadSubject(sub);
                        if (window.innerWidth <= 1024) sidebar.classList.remove('open');
                    };

                    btn.innerHTML = `
                        <div class="subject-btn-content">
                            <span class="subject-icon">${sub.icon || '📚'}</span>
                            <span class="subject-name">${sub.title}</span>
                        </div>
                        <span class="badge-count">${sub.total_questions || ''}</span>
                    `;
                    group.appendChild(btn);
                });

                sidebarSubjects.appendChild(group);
            }
        }

        // Load Subject Data
        async function loadSubject(subject) {
            state.currentSubject = subject;
            state.activeModule = "ALL";
            state.searchQuery = "";
            state.currentPage = 1;
            state.quizScores = {};
            globalSearchInput.value = "";

            renderSidebar();
            updateSubjectHero(subject);

            questionsList.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading ${subject.title} questions...</p>
                </div>
            `;

            try {
                const res = await fetch(`./${encodeURIComponent(subject.file)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                processSubjectData(data);
            } catch (err) {
                console.error("Fetch error:", err);
                questionsList.innerHTML = `
                    <div class="question-card" style="text-align: center; padding: 40px;">
                        <h3 style="color: var(--error); margin-bottom: 10px;">Failed to load questions</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 20px;">Could not fetch <code>${subject.file}</code> directly.</p>
                        <label for="custom-file-input" class="action-btn" style="display: inline-flex; margin: 0 auto;">
                            📁 Select JSON File from Computer
                        </label>
                    </div>
                `;
            }
        }

        // Process raw data into flat questions array with module meta
        function processSubjectData(data) {
            const flattened = [];
            const moduleOptions = [];

            if (Array.isArray(data)) {
                data.forEach((mod, modIdx) => {
                    const modTitle = mod.title || `Module ${modIdx + 1}`;
                    moduleOptions.push(modTitle);

                    if (Array.isArray(mod.links)) {
                        mod.links.forEach(link => {
                            const topicName = link.text || "Topic";
                            const context = link.context || "";

                            if (Array.isArray(link.mcqs)) {
                                link.mcqs.forEach(mcq => {
                                    flattened.push({
                                        id: `${modIdx}_${mcq.question_no}_${Math.random().toString(36).substr(2, 5)}`,
                                        moduleTitle: modTitle,
                                        topicName: topicName,
                                        context: context,
                                        questionNo: mcq.question_no,
                                        question: mcq.question,
                                        options: mcq.options || {},
                                        answer: mcq.answer || "",
                                        explanation: mcq.explanation || ""
                                    });
                                });
                            }
                        });
                    }
                });
            }

            state.currentQuestions = flattened;
            populateModuleDropdown(moduleOptions);
            filterAndRenderQuestions();
        }

        // Populate Module Filter Dropdown
        function populateModuleDropdown(modules) {
            moduleFilterSelect.innerHTML = `<option value="ALL">All Modules (${state.currentQuestions.length} Questions)</option>`;
            modules.forEach(mod => {
                const count = state.currentQuestions.filter(q => q.moduleTitle === mod).length;
                const opt = document.createElement('option');
                opt.value = mod;
                opt.textContent = `${mod} (${count} Qs)`;
                moduleFilterSelect.appendChild(opt);
            });
        }

        // Filter and Render Questions
        function filterAndRenderQuestions() {
            let filtered = state.currentQuestions;

            // Module Filter
            if (state.activeModule !== "ALL") {
                filtered = filtered.filter(q => q.moduleTitle === state.activeModule);
            }

            // Search Query
            if (state.searchQuery.trim() !== "") {
                const query = state.searchQuery.toLowerCase();
                filtered = filtered.filter(q => {
                    return q.question.toLowerCase().includes(query) ||
                           q.topicName.toLowerCase().includes(query) ||
                           q.explanation.toLowerCase().includes(query) ||
                           Object.values(q.options).some(opt => opt.toLowerCase().includes(query));
                });
            }

            state.filteredQuestions = filtered;
            renderQuestionsPage();
        }

        // Render Page of Questions
        function renderQuestionsPage() {
            const total = state.filteredQuestions.length;
            if (total === 0) {
                questionsList.innerHTML = `
                    <div class="question-card" style="text-align: center; padding: 50px;">
                        <h3>No questions found</h3>
                        <p style="color: var(--text-muted); margin-top: 8px;">Try adjusting your search query or module filter.</p>
                    </div>
                `;
                paginationBar.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(total / state.pageSize);
            if (state.currentPage > totalPages) state.currentPage = 1;

            const startIndex = (state.currentPage - 1) * state.pageSize;
            const pageItems = state.filteredQuestions.slice(startIndex, startIndex + state.pageSize);

            questionsList.innerHTML = '';

            pageItems.forEach((q, idx) => {
                const globalIndex = startIndex + idx + 1;
                const card = createQuestionCard(q, globalIndex);
                questionsList.appendChild(card);
            });

            renderPagination(totalPages);
            updateQuizProgress();

            // Trigger MathJax re-render if equations exist
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([questionsList]).catch(err => console.log('MathJax error', err));
            }
        }

        // Create Individual Question Card
        function createQuestionCard(q, indexNumber) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${q.id}`;

            const isBookmarked = state.bookmarks.includes(q.id);

            // Clean correct answer key
            const correctKeyMatch = q.answer.match(/^([a-eA-E])/i);
            const correctKey = correctKeyMatch ? correctKeyMatch[1].toLowerCase() : '';

            // Card Header
            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `
                <div class="card-tags">
                    <span class="q-number-badge">#${indexNumber}</span>
                    <span class="module-tag">${q.moduleTitle}</span>
                    <span class="module-tag">${q.topicName}</span>
                </div>
                <button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" title="Bookmark question" onclick="toggleBookmark('${q.id}')">
                    ${isBookmarked ? '⭐' : '☆'}
                </button>
            `;
            card.appendChild(header);

            // Problem Statement
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = q.question;
            card.appendChild(qText);

            // Options Grid
            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'options-grid';

            for (const [key, val] of Object.entries(q.options)) {
                const optItem = document.createElement('div');
                optItem.className = 'option-item';
                optItem.dataset.optKey = key.toLowerCase();

                // If in study mode and showAllAnswers is on
                if (!state.isQuizMode && state.showAllAnswers && key.toLowerCase() === correctKey) {
                    optItem.classList.add('revealed-correct');
                }

                // If quiz answered already
                const userScore = state.quizScores[q.id];
                if (userScore) {
                    if (key.toLowerCase() === userScore.selected) {
                        optItem.classList.add(userScore.isCorrect ? 'correct' : 'incorrect');
                    } else if (key.toLowerCase() === correctKey) {
                        optItem.classList.add('revealed-correct');
                    }
                }

                optItem.innerHTML = `
                    <div class="option-key">${key.toUpperCase()}</div>
                    <div class="option-text">${val}</div>
                `;

                optItem.onclick = () => handleOptionClick(q, key.toLowerCase(), correctKey, card);
                optionsGrid.appendChild(optItem);
            }
            card.appendChild(optionsGrid);

            // Explanation Section
            const explWrapper = document.createElement('div');
            explWrapper.className = 'explanation-wrapper';
            
            const isAnswerVisible = state.showAllAnswers || (!state.isQuizMode) || (state.quizScores[q.id]);

            explWrapper.innerHTML = `
                <button class="explanation-toggle-btn" onclick="toggleCardExplanation('${q.id}')">
                    <span>💡</span> <span id="expl-btn-text-${q.id}">${isAnswerVisible ? 'Hide Explanation' : 'View Explanation'}</span>
                </button>
                <div class="explanation-content" id="expl-content-${q.id}" style="display: ${isAnswerVisible ? 'block' : 'none'};">
                    <div class="correct-answer-header">
                        <span>✓ Correct Answer:</span> <strong>${q.answer}</strong>
                    </div>
                    <div>${q.explanation || 'No detailed explanation provided.'}</div>
                </div>
            `;
            card.appendChild(explWrapper);

            return card;
        }

        // Option Click Handler
        function handleOptionClick(q, selectedKey, correctKey, card) {
            if (!state.isQuizMode) return;

            const isCorrect = (selectedKey === correctKey);
            state.quizScores[q.id] = { selected: selectedKey, isCorrect: isCorrect };

            // Update option styles in card
            const options = card.querySelectorAll('.option-item');
            options.forEach(opt => {
                const optKey = opt.dataset.optKey;
                opt.classList.remove('correct', 'incorrect', 'revealed-correct');
                if (optKey === selectedKey) {
                    opt.classList.add(isCorrect ? 'correct' : 'incorrect');
                } else if (optKey === correctKey) {
                    opt.classList.add('revealed-correct');
                }
            });

            // Reveal explanation
            const explContent = document.getElementById(`expl-content-${q.id}`);
            const explBtnText = document.getElementById(`expl-btn-text-${q.id}`);
            if (explContent) {
                explContent.style.display = 'block';
                if (explBtnText) explBtnText.textContent = 'Hide Explanation';
            }

            updateQuizProgress();
        }

        // Toggle Single Card Explanation
        window.toggleCardExplanation = function(qId) {
            const content = document.getElementById(`expl-content-${qId}`);
            const btnText = document.getElementById(`expl-btn-text-${qId}`);
            if (!content) return;

            if (content.style.display === 'none') {
                content.style.display = 'block';
                if (btnText) btnText.textContent = 'Hide Explanation';
            } else {
                content.style.display = 'none';
                if (btnText) btnText.textContent = 'View Explanation';
            }
        };

        // Bookmark Toggle
        window.toggleBookmark = function(qId) {
            const idx = state.bookmarks.indexOf(qId);
            if (idx === -1) {
                state.bookmarks.push(qId);
            } else {
                state.bookmarks.splice(idx, 1);
            }
            localStorage.setItem('mcq_bookmarks', JSON.stringify(state.bookmarks));
            renderQuestionsPage();
        };

        // Pagination Render
        function renderPagination(totalPages) {
            paginationBar.innerHTML = '';
            if (totalPages <= 1) return;

            // Prev Button
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '←';
            prevBtn.disabled = state.currentPage === 1;
            prevBtn.onclick = () => { state.currentPage--; renderQuestionsPage(); window.scrollTo({top: 0, behavior: 'smooth'}); };
            paginationBar.appendChild(prevBtn);

            // Page numbers
            const maxVisible = 5;
            let start = Math.max(1, state.currentPage - 2);
            let end = Math.min(totalPages, start + maxVisible - 1);
            if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

            for (let p = start; p <= end; p++) {
                const pBtn = document.createElement('button');
                pBtn.className = `page-btn ${p === state.currentPage ? 'active' : ''}`;
                pBtn.textContent = p;
                pBtn.onclick = () => { state.currentPage = p; renderQuestionsPage(); window.scrollTo({top: 0, behavior: 'smooth'}); };
                paginationBar.appendChild(pBtn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = '→';
            nextBtn.disabled = state.currentPage === totalPages;
            nextBtn.onclick = () => { state.currentPage++; renderQuestionsPage(); window.scrollTo({top: 0, behavior: 'smooth'}); };
            paginationBar.appendChild(nextBtn);
        }

        // Update Hero Meta
        function updateSubjectHero(subject) {
            document.getElementById('nav-subject-icon').textContent = subject.icon || '📚';
            document.getElementById('nav-subject-title').textContent = subject.title;
            document.getElementById('hero-icon').textContent = subject.icon || '📚';
            document.getElementById('hero-title').textContent = subject.title;
            document.getElementById('hero-description').textContent = subject.description || 'Comprehensive multiple choice questions collection.';
            document.getElementById('stat-modules').textContent = subject.total_modules || (subject.modules ? subject.modules.length : 'N/A');
            document.getElementById('stat-questions').textContent = subject.total_questions || 'N/A';
        }

        // Quiz Progress
        function updateQuizProgress() {
            const answered = Object.keys(state.quizScores).length;
            const correct = Object.values(state.quizScores).filter(s => s.isCorrect).length;
            const percentage = answered > 0 ? Math.round((correct / answered) * 100) : 0;

            const scoreDisplay = document.getElementById('quiz-score-display');
            const scorePill = document.getElementById('score-pill');
            const statScore = document.getElementById('stat-score');

            if (scoreDisplay) scoreDisplay.textContent = `${correct} / ${answered} (${percentage}%)`;
            if (statScore) statScore.textContent = `${correct} / ${answered} (${percentage}%)`;
            if (scorePill) scorePill.style.display = state.isQuizMode ? 'flex' : 'none';
        }

        // Toggle Quiz Mode
        function toggleQuizMode() {
            state.isQuizMode = !state.isQuizMode;
            modeToggleBtn.classList.toggle('active', state.isQuizMode);
            modeIcon.textContent = state.isQuizMode ? '🎯' : '📖';
            modeText.textContent = state.isQuizMode ? 'Quiz Active' : 'Quiz Mode';
            
            document.getElementById('quiz-score-container').style.display = state.isQuizMode ? 'flex' : 'none';
            document.getElementById('score-pill').style.display = state.isQuizMode ? 'flex' : 'none';

            renderQuestionsPage();
        }

        // Toggle All Answers
        function toggleAllAnswers() {
            state.showAllAnswers = !state.showAllAnswers;
            toggleAllAnswersBtn.classList.toggle('active', state.showAllAnswers);
            answersToggleText.textContent = state.showAllAnswers ? 'Hide All' : 'Show All';
            renderQuestionsPage();
        }

        // Toggle Theme
        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', state.theme);
            localStorage.setItem('mcq_theme', state.theme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            themeIcon.textContent = state.theme === 'dark' ? '🌙' : '☀️';
        }

        // Search & Filter Handlers
        function handleSearch(e) {
            state.searchQuery = e.target.value;
            state.currentPage = 1;
            filterAndRenderQuestions();
        }

        function handleModuleFilter(e) {
            state.activeModule = e.target.value;
            state.currentPage = 1;
            filterAndRenderQuestions();
        }

        // Custom File Upload
        function handleCustomFileUpload(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        const customSubject = {
                            file: file.name,
                            title: file.name.replace('.json', ''),
                            icon: '📁',
                            category: 'Custom Uploads',
                            description: 'Locally uploaded JSON question bank.',
                            total_questions: countQuestions(parsed)
                        };
                        state.subjects.push(customSubject);
                        renderSidebar();
                        state.currentSubject = customSubject;
                        processSubjectData(parsed);
                        updateSubjectHero(customSubject);
                    } catch (err) {
                        alert('Error parsing custom JSON file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            });
        }

        function countQuestions(data) {
            if (!Array.isArray(data)) return 0;
            let count = 0;
            data.forEach(m => {
                if (Array.isArray(m.links)) {
                    m.links.forEach(l => {
                        if (Array.isArray(l.mcqs)) count += l.mcqs.length;
                    });
                }
            });
            return count;
        }

        // Launch
        initApp();
    </script>
</body>
</html>
